<svg xmlns="http://www.w3.org/2000/svg" width="396" height="20" viewBox="0 0 396 20" role="img" aria-labelledby="title description">
  <title id="title">Project license and runtime compatibility</title>
  <desc id="description">Apache 2.0 license, Python 3.10 or later, and Ansible Core versions 2.16 through 2.21.</desc>
  <defs>
    <clipPath id="license-clip">
      <rect width="124" height="20" rx="3"/>
    </clipPath>
    <clipPath id="python-clip">
      <rect width="108" height="20" rx="3"/>
    </clipPath>
    <clipPath id="ansible-clip">
      <rect width="148" height="20" rx="3"/>
    </clipPath>
  </defs>
  <g font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" fill="#fff" text-anchor="middle">
    <g clip-path="url(#license-clip)">
      <rect width="48" height="20" fill="#555"/>
      <rect x="48" width="76" height="20" fill="#2f855a"/>
    </g>
    <text x="24" y="14">License</text>
    <text x="86" y="14">Apache 2.0</text>

    <g transform="translate(132)">
      <g clip-path="url(#python-clip)">
        <rect width="48" height="20" fill="#555"/>
        <rect x="48" width="60" height="20" fill="#3776ab"/>
      </g>
      <text x="24" y="14">Python</text>
      <text x="78" y="14">3.10+</text>
    </g>

    <g transform="translate(248)">
      <g clip-path="url(#ansible-clip)">
        <rect width="78" height="20" fill="#555"/>
        <rect x="78" width="70" height="20" fill="#ee0000"/>
      </g>
      <text x="39" y="14">Ansible Core</text>
      <text x="113" y="14">2.16-2.21</text>
    </g>
  </g>
</svg>
