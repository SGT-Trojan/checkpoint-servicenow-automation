<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1100" width="1900" height="1100" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Execution architecture</title>
  <desc id="diagramDesc">Optional ServiceNow governance and direct operator entry converge on a resumable automation runner. Readiness and target resolution precede CDT, Management API, or guarded direct deployment. The original standby member changes first, followed by failover and a human validation gate, the original active member, final assurance, and retained evidence with exact-phase resume.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.2px;
      }
      .t-title    { font-size: 30px; font-weight: 700; fill: #172033; }
      .t-sub      { font-size: 16px; font-weight: 400; fill: #526278; }
      .t-ref      { font-size: 13px; font-weight: 500; fill: #8494a8; }
      .lane-kick  { font-size: 14px; font-weight: 700; fill: #526278; letter-spacing: 1px; }
      .lane-title { font-size: 21px; font-weight: 700; fill: #172033; }
      .k          { font-size: 12px; font-weight: 700; fill: #526278; letter-spacing: 1px; }
      .k-blue     { fill: #2563eb; }
      .k-green    { fill: #16845b; }
      .k-violet   { fill: #7e22ce; }
      .k-orange   { fill: #c2560b; }
      .step       { font-size: 12px; font-weight: 700; fill: #8494a8; letter-spacing: 1px; text-anchor: end; }
      .ct         { font-size: 19px; font-weight: 700; fill: #172033; }
      .cd         { font-size: 14px; font-weight: 400; fill: #526278; }
      .cd-blue    { font-size: 14px; font-weight: 600; fill: #2563eb; }
      .cl         { font-size: 13px; font-weight: 600; fill: #526278; }
      .cl-blue    { fill: #2563eb; }
      .cl-violet  { fill: #7e22ce; }
      .cl-light   { fill: #7d8ca1; }
      .note       { font-size: 13px; font-weight: 400; fill: #64748b; }
      .lg         { font-size: 13px; font-weight: 500; fill: #334155; }
      .mid        { text-anchor: middle; }
      .end        { text-anchor: end; }
      .ln         { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .solid      { stroke-width: 1.9; }
      .dash       { stroke-width: 1.9; stroke-dasharray: 8 6; }
      .neutral    { stroke: #526278; }
      .blue       { stroke: #2563eb; }
      .violet     { stroke: #9333ea; }
      .green      { stroke: #16845b; }
      .light      { stroke: #94a3b8; }
      .halo       { stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; paint-order: stroke; }
    ]]></style>

    <marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#526278"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16845b"/>
    </marker>
    <marker id="ah-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>

    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1900" height="1100" fill="#ffffff"/>

  <!-- ================= LAYER 1: HEADER ================= -->
  <g aria-label="Diagram header">
    <text class="t-title" x="40" y="56">Execution architecture</text>
    <text class="t-sub" x="40" y="86">One technical safety model across direct and ServiceNow-governed maintenance</text>
    <text class="t-ref end" x="1860" y="58">Reference implementation: checkpoint-servicenow-automation</text>
  </g>

  <!-- ================= LAYER 2: SWIMLANE BACKGROUNDS ================= -->
  <g aria-label="Swimlane backgrounds">
    <g aria-label="Swimlane 1: intake and governance">
      <rect x="40" y="110" width="1820" height="206" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
      <line x1="300" y1="132" x2="300" y2="294" stroke="#bfdbfe" stroke-width="1" stroke-dasharray="3 5"/>
      <text class="lane-kick" x="64" y="186">01 / INTAKE + GOVERNANCE</text>
      <text class="lane-title" x="64" y="214">Direct or governed</text>
      <text class="lane-title" x="64" y="240">start</text>
    </g>

    <g aria-label="Swimlane 2: automation host">
      <rect x="40" y="336" width="1820" height="280" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="300" y1="358" x2="300" y2="594" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 5"/>
      <text class="lane-kick" x="64" y="442">02 / AUTOMATION HOST</text>
      <text class="lane-title" x="64" y="470">Resolve, gate,</text>
      <text class="lane-title" x="64" y="496">execute, and resume</text>
    </g>

    <g aria-label="Swimlane 3: Check Point estate">
      <rect x="40" y="660" width="1820" height="316" rx="14" fill="#eefbf5" stroke="#bbf7d0" stroke-width="1.2"/>
      <line x1="300" y1="682" x2="300" y2="954" stroke="#bbf7d0" stroke-width="1" stroke-dasharray="3 5"/>
      <text class="lane-kick" x="64" y="776">03 / CHECK POINT ESTATE</text>
      <text class="lane-title" x="64" y="804">Change one member</text>
      <text class="lane-title" x="64" y="830">at a time</text>
    </g>
  </g>

  <!-- ================= LAYER 3: CARDS ================= -->
  <g aria-label="Cards">

    <!-- Lane 1 cards -->
    <g aria-label="Actor card: operator or requester">
      <rect x="320" y="132" width="268" height="160" rx="11" fill="#ffffff" stroke="#a8b4c5" stroke-width="1.4" filter="url(#cardShadow)"/>
      <text class="k" x="336" y="160">ACTOR</text>
      <text class="step" x="572" y="160">STEP 01</text>
      <text class="ct" x="336" y="194">Operator or requester</text>
      <text class="cd" x="336" y="226">direct run or governed request</text>
      <text class="cd" x="336" y="250">starts either execution path</text>
    </g>

    <g aria-label="ServiceNow change control card, optional governance">
      <rect x="700" y="132" width="268" height="160" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#cardShadow)"/>
      <text class="k k-blue" x="716" y="160">SERVICENOW</text>
      <text class="ct" x="716" y="194">Change control</text>
      <text class="cd" x="716" y="226">request / approvals / task state</text>
      <text class="cd-blue" x="716" y="250">optional governance layer</text>
      <text class="cd" x="716" y="274">does not replace the runner</text>
    </g>

    <!-- Lane 2 cards -->
    <g aria-label="Step 02 entry path card: governed or direct, same technical safety checks">
      <rect x="320" y="400" width="268" height="176" rx="11" fill="#ffffff" stroke="#a8b4c5" stroke-width="1.4" filter="url(#cardShadow)"/>
      <text class="k" x="336" y="428">ENTRY PATH</text>
      <text class="step" x="572" y="428">STEP 02</text>
      <text class="ct" x="336" y="462">Governed or direct</text>
      <text class="cd" x="336" y="496">same technical safety checks</text>
      <text class="cd" x="336" y="520">governed adds approval records</text>
      <text class="cd" x="336" y="544">direct uses self-attestation</text>
    </g>

    <g aria-label="Step 03 orchestration card: resumable runner">
      <rect x="632" y="400" width="268" height="176" rx="11" fill="#ffffff" stroke="#a8b4c5" stroke-width="1.4" filter="url(#cardShadow)"/>
      <text class="k" x="648" y="428">ORCHESTRATION</text>
      <text class="step" x="884" y="428">STEP 03</text>
      <text class="ct" x="648" y="462">Resumable runner</text>
      <text class="cd" x="648" y="496">phase-controlled execution</text>
      <text class="cd" x="648" y="520">runner owns sequencing and</text>
      <text class="cd" x="648" y="544">all final decisions</text>
    </g>

    <g aria-label="Step 04 fail closed gate card: readiness and resolution">
      <rect x="944" y="400" width="268" height="176" rx="11" fill="#fff7ed" stroke="#f97316" stroke-width="1.8" filter="url(#cardShadow)"/>
      <text class="k k-orange" x="960" y="428">FAIL-CLOSED GATE</text>
      <text class="step" x="1196" y="428">STEP 04</text>
      <text class="ct" x="960" y="462">Readiness + resolution</text>
      <text class="cd" x="960" y="496">identity / health / package</text>
      <text class="cd" x="960" y="520">one managed object per target</text>
      <text class="cd" x="960" y="544">readiness failure stops the run</text>
    </g>

    <g aria-label="Step 05 transport card: deployment backend, CDT or Management API">
      <rect x="1256" y="400" width="268" height="176" rx="11" fill="#ffffff" stroke="#a8b4c5" stroke-width="1.4" filter="url(#cardShadow)"/>
      <text class="k" x="1272" y="428">TRANSPORT</text>
      <text class="step" x="1508" y="428">STEP 05</text>
      <text class="ct" x="1272" y="462">Deployment backend</text>
      <text class="cd" x="1272" y="496">CDT / Management API</text>
      <text class="cd" x="1272" y="520">package operations only</text>
      <text class="cd" x="1272" y="544">guarded fallback if required</text>
    </g>

    <g aria-label="Durable state card: evidence and resume">
      <rect x="1568" y="400" width="268" height="176" rx="11" fill="#f1f5f9" stroke="#718096" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text class="k" x="1584" y="428">DURABLE STATE</text>
      <text class="ct" x="1584" y="462">Evidence + resume</text>
      <text class="cd" x="1584" y="496">phase notes / exact point</text>
      <text class="cd" x="1584" y="520">resume returns to the exact</text>
      <text class="cd" x="1584" y="544">authorized phase</text>
    </g>

    <!-- Lane 3 cards -->
    <g aria-label="Management card: MDS or management domain">
      <rect x="320" y="698" width="268" height="180" rx="11" fill="#ffffff" stroke="#16845b" stroke-width="1.6" filter="url(#cardShadow)"/>
      <text class="k k-green" x="336" y="726">MANAGEMENT</text>
      <text class="ct" x="336" y="760">MDS / management</text>
      <text class="ct" x="336" y="784">domain</text>
      <text class="cd" x="336" y="818">policy + package context</text>
      <text class="cd" x="336" y="842">read-only discovery target</text>
    </g>

    <g aria-label="Step 06 member 1 card: original standby changed first">
      <rect x="632" y="698" width="268" height="180" rx="11" fill="#ffffff" stroke="#16845b" stroke-width="1.6" filter="url(#cardShadow)"/>
      <text class="k k-green" x="648" y="726">MEMBER 1</text>
      <text class="step" x="884" y="726">STEP 06</text>
      <text class="ct" x="648" y="760">Original standby</text>
      <text class="cd" x="648" y="794">changed first</text>
      <text class="cd" x="648" y="818">result reconciled before</text>
      <text class="cd" x="648" y="842">failover</text>
    </g>

    <g aria-label="Step 07 human control card: fail over to member 1 then tester validation">
      <rect x="944" y="698" width="268" height="180" rx="11" fill="#faf5ff" stroke="#9333ea" stroke-width="2.4" filter="url(#cardShadow)"/>
      <text class="k k-violet" x="960" y="726">HUMAN CONTROL</text>
      <text class="step" x="1196" y="726">STEP 07</text>
      <text class="ct" x="960" y="760">Fail over to member 1</text>
      <text class="cd" x="960" y="794">then tester validation</text>
      <text class="cd" x="960" y="818">workflow pauses here</text>
      <text class="cd" x="960" y="842">technical pause on both paths</text>
    </g>

    <g aria-label="Step 08 member 2 card: original active changed second">
      <rect x="1256" y="698" width="268" height="180" rx="11" fill="#ffffff" stroke="#16845b" stroke-width="1.6" filter="url(#cardShadow)"/>
      <text class="k k-green" x="1272" y="726">MEMBER 2</text>
      <text class="step" x="1508" y="726">STEP 08</text>
      <text class="ct" x="1272" y="760">Original active</text>
      <text class="cd" x="1272" y="794">changed second</text>
      <text class="cd" x="1272" y="818">only after the gate clears</text>
    </g>

    <g aria-label="Step 09 assurance card: final validation">
      <rect x="1568" y="698" width="268" height="180" rx="11" fill="#ffffff" stroke="#16845b" stroke-width="1.6" filter="url(#cardShadow)"/>
      <text class="k k-green" x="1584" y="726">ASSURANCE</text>
      <text class="step" x="1820" y="726">STEP 09</text>
      <text class="ct" x="1584" y="760">Final validation</text>
      <text class="cd" x="1584" y="794">health / policy / interfaces</text>
      <text class="cd" x="1584" y="818">package or version state</text>
      <text class="cd" x="1584" y="842">PNOTEs + ownership restore</text>
    </g>
  </g>

  <!-- ================= LAYER 4: CONNECTORS (always above lanes and cards) ================= -->
  <g aria-label="Connectors">

    <!-- Lane 1 governance branch -->
    <line class="ln solid blue" x1="588" y1="212" x2="692" y2="212" marker-end="url(#ah-blue)"/>
    <text class="cl cl-blue mid halo" x="640" y="200">submit</text>

    <path class="ln solid blue" d="M420,292 V396" marker-end="url(#ah-blue)"/>
    <text class="cl cl-blue halo" x="432" y="352">direct</text>

    <path class="ln solid blue" d="M790,292 V324 H500 V396" marker-end="url(#ah-blue)"/>
    <text class="cl cl-blue mid halo" x="645" y="314">approved change</text>

    <!-- Lane 2 sequence -->
    <line class="ln solid neutral" x1="588" y1="488" x2="626" y2="488" marker-end="url(#ah-neutral)"/>
    <line class="ln solid neutral" x1="900" y1="488" x2="938" y2="488" marker-end="url(#ah-neutral)"/>
    <line class="ln solid neutral" x1="1212" y1="488" x2="1250" y2="488" marker-end="url(#ah-neutral)"/>
    <line class="ln dash light" x1="1524" y1="488" x2="1562" y2="488" marker-end="url(#ah-light)"/>

    <!-- resume exact phase -->
    <path class="ln dash neutral" d="M1650,400 V368 H740 V396" marker-end="url(#ah-neutral)"/>
    <text class="cl mid halo" x="1200" y="358">resume exact phase</text>

    <!-- evidence back to ServiceNow -->
    <path class="ln dash blue" d="M1780,400 V250 H976" marker-end="url(#ah-blue)"/>
    <text class="cl cl-blue mid halo" x="1380" y="240">notes / evidence / outcome</text>

    <!-- cross-lane: automation host to estate -->
    <path class="ln solid neutral" d="M1000,576 V604 H380 V694" marker-end="url(#ah-neutral)"/>
    <text class="cl mid halo" x="690" y="594">read-only discovery</text>

    <path class="ln solid neutral" d="M1300,576 V636 H450 V694" marker-end="url(#ah-neutral)"/>
    <text class="cl mid halo" x="1000" y="626">CDT or API</text>

    <path class="ln dash neutral" d="M1450,576 V668 H720 V694" marker-end="url(#ah-neutral)"/>
    <text class="cl mid halo" x="1180" y="658">guarded direct fallback</text>

    <!-- estate results returning to durable state -->
    <path class="ln dash light" d="M1702,694 V580" marker-end="url(#ah-light)"/>
    <text class="cl cl-light end halo" x="1688" y="630">results retained</text>

    <!-- Lane 3 sequence -->
    <line class="ln solid green" x1="588" y1="788" x2="626" y2="788" marker-end="url(#ah-green)"/>
    <line class="ln solid violet" x1="900" y1="788" x2="938" y2="788" marker-end="url(#ah-violet)"/>
    <line class="ln solid violet" x1="1212" y1="788" x2="1250" y2="788" marker-end="url(#ah-violet)"/>
    <line class="ln solid green" x1="1524" y1="788" x2="1562" y2="788" marker-end="url(#ah-green)"/>

    <!-- gate annotations -->
    <text class="cl cl-violet mid" x="1078" y="906">Direct: operator self-attestation</text>
    <line x1="1234" y1="800" x2="1234" y2="920" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 4"/>
    <text class="cl cl-blue mid" x="1234" y="936">ServiceNow: Closed Complete</text>

    <!-- governance clarification note -->
    <text class="note" x="1000" y="170">ServiceNow governs the record and the approval.</text>
    <text class="note" x="1000" y="192">Every technical safety check still runs on the</text>
    <text class="note" x="1000" y="214">automation host, on both entry paths.</text>
  </g>

  <!-- ================= LAYER 5: LEGEND ================= -->
  <g aria-label="Legend">
    <rect x="40" y="992" width="1820" height="68" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

    <line class="ln solid neutral" x1="70" y1="1027" x2="112" y2="1027" marker-end="url(#ah-neutral)"/>
    <text class="lg" x="128" y="1032">Required control path</text>

    <line class="ln dash neutral" x1="380" y1="1027" x2="422" y2="1027" marker-end="url(#ah-neutral)"/>
    <text class="lg" x="438" y="1032">Conditional, fallback, or evidence path</text>

    <rect x="800" y="1018" width="18" height="18" rx="5" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text class="lg" x="830" y="1032">Human decision gate</text>

    <rect x="1120" y="1018" width="18" height="18" rx="5" fill="#ffffff" stroke="#16845b" stroke-width="2"/>
    <text class="lg" x="1150" y="1032">Managed Check Point estate</text>

    <rect x="1450" y="1018" width="18" height="18" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text class="lg" x="1480" y="1032">Governed ServiceNow path</text>
  </g>
</svg>
