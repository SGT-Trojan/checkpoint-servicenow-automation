name: Bug report
description: Report a reproducible defect without including sensitive operational data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private addresses, customer names, ServiceNow
        record exports, package binaries, or live evidence.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Include the minimum safe steps or fixture needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Data hygiene
      options:
        - label: I removed credentials, private topology, customer data, and live evidence.
          required: true
