name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s ansible/scripts/tests -v
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 -m py_compile checkpoint_cluster_upgrade.py servicenow_checkpoint_*.py ansible/scripts/*.py tools/*.py
      - name: Check supported minimum Ansible
        run: |
          python3 -m venv /tmp/ansible-min
          /tmp/ansible-min/bin/pip install "ansible-core==2.16.14"
          for playbook in ansible/playbooks/*.yml examples/playbooks/*.yml; do
            /tmp/ansible-min/bin/ansible-playbook --syntax-check "$playbook" -i ansible/inventory/hosts.yml
          done
      - name: Check current Ansible
        run: |
          python3 -m venv /tmp/ansible-current
          /tmp/ansible-current/bin/pip install "ansible-core>=2.21.2,<2.22"
          for playbook in ansible/playbooks/*.yml examples/playbooks/*.yml; do
            /tmp/ansible-current/bin/ansible-playbook --syntax-check "$playbook" -i ansible/inventory/hosts.yml
          done
      - run: python3 tools/scan_public_repository.py .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
