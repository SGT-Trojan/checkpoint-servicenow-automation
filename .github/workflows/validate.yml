name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s ansible/scripts/tests -v
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 -m py_compile checkpoint_cluster_upgrade.py servicenow_checkpoint_*.py ansible/scripts/*.py tools/*.py
      - run: pip install "ansible-core>=2.16,<2.22"
      - run: |
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook --syntax-check "$playbook" -i ansible/inventory/hosts.yml
          done
      - run: python3 tools/scan_public_repository.py .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
