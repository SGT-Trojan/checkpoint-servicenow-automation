---
- name: "Validate package prerequisites - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    reports_dir: "{{ playbook_dir }}/../reports"
    scripts_dir: "{{ playbook_dir }}/../scripts"
    prereq_step_slug: "{{ step | default('package_step') | regex_replace('[^A-Za-z0-9_.-]+', '_') | regex_replace('^_+|_+$', '') }}"
  tasks:
    - name: Assert credentials, activity plan, phase, and step are supplied
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
          - activity_plan_file | default('') | length > 0
          - phase | default('') | length > 0
          - step | default('') | length > 0
        fail_msg: "CP_PASSWORD, CP_EXPERT_PASSWORD, activity_plan_file, phase, and step are required for package prerequisite validation."

    - name: Validate package prerequisites against current member inventory
      ansible.builtin.command:
        argv:
          - "{{ scripts_dir }}/validate_package_prerequisites.py"
          - --activity-plan-file
          - "{{ activity_plan_file }}"
          - --reports-dir
          - "{{ reports_dir }}"
          - --phase
          - "{{ phase }}"
          - --step
          - "{{ step }}"
          - --username
          - admin
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: package_prereqs
      changed_when: false

    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: "0755"

    - name: Save package prerequisite validation output
      ansible.builtin.copy:
        dest: "{{ reports_dir }}/08_validate_package_prerequisites_{{ chg_number | default('unknown') }}_{{ phase }}_{{ prereq_step_slug }}.txt"
        content: |
          {{ package_prereqs.stdout | default('') }}
          {{ package_prereqs.stderr | default('') }}
        mode: "0644"

    - name: Show package prerequisite validation output
      ansible.builtin.debug:
        var: package_prereqs.stdout_lines
