---
- name: "Major upgrade MVC gate - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    reports_dir: "{{ playbook_dir }}/../reports"
    scripts_dir: "{{ playbook_dir }}/../scripts"
  tasks:
    - name: Assert required inputs
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
          - activity_plan_file | default('') | length > 0
          - phase in ['mvc-on', 'mvc-off']
        fail_msg: "CP_PASSWORD, CP_EXPERT_PASSWORD, activity_plan_file and mvc phase are required."
    - name: Run MVC operation
      ansible.builtin.command:
        argv:
          - "{{ scripts_dir }}/major_mvc_from_activity.py"
          - --activity-plan-file
          - "{{ activity_plan_file }}"
          - --reports-dir
          - "{{ reports_dir }}"
          - --phase
          - "{{ phase }}"
          - --username
          - admin
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: mvc_output
      changed_when: true
    - name: Save MVC report
      ansible.builtin.copy:
        dest: "{{ reports_dir }}/32_major_mvc_{{ chg_number | default('unknown') }}_{{ phase }}.txt"
        content: "{{ mvc_output.stdout }}\n{{ mvc_output.stderr }}\n"
        mode: "0644"
    - name: Show MVC output
      ansible.builtin.debug:
        var: mvc_output.stdout_lines
