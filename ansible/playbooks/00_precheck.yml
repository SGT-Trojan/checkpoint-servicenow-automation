---
- name: "Precheck - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    helper_path: "{{ playbook_dir }}/../../checkpoint_cluster_upgrade.py"
    reports_dir: "{{ playbook_dir }}/../reports"
  tasks:
    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: "0755"

    - name: Assert credentials are supplied
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
        fail_msg: "CP_PASSWORD and CP_EXPERT_PASSWORD must be supplied via the Credential Vault."

    - name: Run gateway cluster precheck
      ansible.builtin.command:
        argv:
          - python3
          - "{{ helper_path }}"
          - --members
          - "{{ member_a_ip | mandatory }}"
          - "{{ member_b_ip | mandatory }}"
          - --username
          - admin
          - --phase
          - precheck
          - --icap-mode
          - "{{ icap_mode | default('disabled') }}"
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: precheck
      changed_when: false

    - name: Save precheck output
      ansible.builtin.copy:
        dest: "{{ reports_dir }}/00_precheck_{{ chg_number | default('unknown') }}.txt"
        content: "{{ precheck.stdout }}\n"
        mode: "0644"

    - name: Show precheck results
      ansible.builtin.debug:
        var: precheck.stdout_lines
