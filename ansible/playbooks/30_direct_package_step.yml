---
- name: "Direct CPUSE/Clish package step - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    reports_dir: "{{ playbook_dir }}/../reports"
    scripts_dir: "{{ playbook_dir }}/../scripts"
    direct_step_name: "{{ step | default('package_step') }}"
    report_suffix: "{{ ((phase | default('')) ~ '_' ~ direct_step_name) | regex_replace('[^A-Za-z0-9_.-]+', '_') | regex_replace('^_+|_+$', '') }}"
  tasks:
    - name: Assert credentials and activity plan are supplied
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
          - activity_plan_file | default('') | length > 0
          - step | default('') | length > 0
          - operation_id | default('') is match('^run_[0-9a-f]{64}$')
          - mutation_intent_dir | default('') | length > 0
        fail_msg: >-
          CP_PASSWORD, CP_EXPERT_PASSWORD, activity_plan_file, step, a valid
          operation_id, and mutation_intent_dir are required for direct package execution.

    - name: Require explicit direct execution approval
      ansible.builtin.assert:
        that:
          - checkpoint_execute_direct | default(false) | bool
        fail_msg: >-
          Direct package execution was not performed. Use the guided workflow button or pass
          checkpoint_execute_direct=true only after the CHG is approved for this specific member/package step.

    - name: Execute guarded direct package step
      ansible.builtin.command:
        argv:
          - "{{ scripts_dir }}/direct_package_step_from_activity.py"
          - --activity-plan-file
          - "{{ activity_plan_file }}"
          - --reports-dir
          - "{{ reports_dir }}"
          - --username
          - admin
          - --phase
          - "{{ phase | default('') }}"
          - --step
          - "{{ step }}"
          - --operation-id
          - "{{ operation_id }}"
          - --mutation-intent-dir
          - "{{ mutation_intent_dir }}"
          - --timeout
          - "{{ checkpoint_direct_execute_timeout | default(14400) }}"
          - --execute
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: direct_execute
      changed_when: true

    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: "0755"

    - name: Save direct execution output
      ansible.builtin.copy:
        dest: "{{ reports_dir }}/30_direct_package_step_{{ chg_number | default('unknown') }}_{{ report_suffix }}.txt"
        content: "{{ direct_execute.stdout }}
{{ direct_execute.stderr }}
"
        mode: "0644"

    - name: Show direct execution output
      ansible.builtin.debug:
        var: direct_execute.stdout_lines
