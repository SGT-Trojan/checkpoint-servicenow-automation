---
- name: "Validate Deployment Agent readiness - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    reports_dir: "{{ playbook_dir }}/../reports"
    scripts_dir: "{{ playbook_dir }}/../scripts"
  tasks:
    - name: Assert credentials and activity plan are supplied
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
          - activity_plan_file | default('') | length > 0
        fail_msg: "CP_PASSWORD, CP_EXPERT_PASSWORD, and activity_plan_file are required for Deployment Agent validation."

    - name: Validate installed DA build and offline DA package readiness
      ansible.builtin.command:
        argv:
          - "{{ scripts_dir }}/validate_deployment_agent.py"
          - --activity-plan-file
          - "{{ activity_plan_file }}"
          - --username
          - admin
          - --minimum-build
          - "{{ minimum_deployment_agent_build | default(activity_plan.execution.minimum_deployment_agent_build | default('')) }}"
          - --offline-package-path
          - "{{ deployment_agent_package_path | default(activity_plan.execution.deployment_agent_package_path | default('')) }}"
          - --offline-package-build
          - "{{ deployment_agent_package_build | default(activity_plan.execution.deployment_agent_package_build | default('')) }}"
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: da_readiness
      changed_when: false

    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: "0755"

    - name: Save Deployment Agent readiness output
      ansible.builtin.copy:
        dest: "{{ reports_dir }}/07_validate_deployment_agent_{{ chg_number | default('unknown') }}.txt"
        content: |
          {{ da_readiness.stdout | default('') }}
          {{ da_readiness.stderr | default('') }}
        mode: "0644"

    - name: Show Deployment Agent readiness output
      ansible.builtin.debug:
        var: da_readiness.stdout_lines
