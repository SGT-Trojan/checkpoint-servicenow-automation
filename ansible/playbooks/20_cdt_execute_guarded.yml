---
- name: "CDT execute (guarded) - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    reports_dir: "{{ playbook_dir }}/../reports"
    scripts_dir: "{{ playbook_dir }}/../scripts"
    cdt_step_name: "{{ step if step | default('') | length > 0 else ((activity_plan.package_steps[0].name | default('package_step')) if activity_plan.package_steps | default([]) | length == 1 else 'package_step') }}"
    cdt_step_slug: "{{ cdt_step_name | regex_replace('[^A-Za-z0-9_.-]+', '_') | regex_replace('^_+|_+$', '') }}"
    cdt_plan_path: "/var/log/tmp/{{ chg_number | default('unknown') }}_{{ cdt_step_slug }}_cdt_plan.xml"
    cdt_candidates_path: "/var/log/tmp/{{ chg_number | default('unknown') }}_{{ cdt_step_slug }}_cdt_candidates.csv"
    report_suffix: "{{ ((phase | default('')) ~ '_' ~ cdt_step_slug) | regex_replace('[^A-Za-z0-9_.-]+', '_') | regex_replace('^_+|_+$', '') }}"
  tasks:
    - name: Assert credentials and activity plan are supplied
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
          - activity_plan_file | default('') | length > 0
          - operation_id | default('') | length > 0
          - phase | default('') in ['first-member', 'second-member']
          - step | default('') | length > 0
          - cdt_context_file | default('') | length > 0
          - cdt_mutation_receipt_file | default('') | length > 0
        fail_msg: "Credentials and plan-bound CDT context inputs are required for CDT execution."

    - name: Require explicit execution approval
      ansible.builtin.assert:
        that:
          - checkpoint_execute_upgrade | default(false) | bool
        fail_msg: >-
          CDT execution was not performed. Pass checkpoint_execute_upgrade=true only after
          the controlled candidate file has been reviewed and the CHG is approved to proceed.

    - name: Validate protected candidate context before mutation
      ansible.builtin.command:
        argv:
          - "{{ scripts_dir }}/record_cdt_mutation.py"
          - --activity-plan-file
          - "{{ activity_plan_file }}"
          - --context-file
          - "{{ cdt_context_file }}"
          - --operation-id
          - "{{ operation_id }}"
          - --phase
          - "{{ phase }}"
          - --step
          - "{{ step }}"
          - --validate-only
      changed_when: false

    - name: Execute CDT using controlled one-member candidate file
      ansible.builtin.command:
        argv:
          - "{{ scripts_dir }}/execute_cdt_from_activity.py"
          - --activity-plan-file
          - "{{ activity_plan_file }}"
          - --username
          - admin
          - --plan-path
          - "{{ cdt_plan_path }}"
          - --candidates-path
          - "{{ cdt_candidates_path }}"
          - --timeout
          - "{{ checkpoint_cdt_execute_timeout | default(14400) }}"
          - --execute
          - --step
          - "{{ step | default('') }}"
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: cdt_execute
      changed_when: true

    - name: Bind successful CDT execution to its candidate context
      ansible.builtin.command:
        argv:
          - "{{ scripts_dir }}/record_cdt_mutation.py"
          - --activity-plan-file
          - "{{ activity_plan_file }}"
          - --context-file
          - "{{ cdt_context_file }}"
          - --receipt-file
          - "{{ cdt_mutation_receipt_file }}"
          - --operation-id
          - "{{ operation_id }}"
          - --phase
          - "{{ phase }}"
          - --step
          - "{{ step }}"
      register: cdt_mutation_receipt
      changed_when: false

    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: "0755"

    - name: Save CDT execute output
      ansible.builtin.copy:
        dest: "{{ reports_dir }}/20_cdt_execute_guarded_{{ chg_number | default('unknown') }}_{{ report_suffix }}.txt"
        content: "{{ cdt_execute.stdout }}
{{ cdt_execute.stderr }}
{{ cdt_mutation_receipt.stdout }}
{{ cdt_mutation_receipt.stderr }}
"
        mode: "0644"

    - name: Show CDT execute output
      ansible.builtin.debug:
        var: cdt_execute.stdout_lines
