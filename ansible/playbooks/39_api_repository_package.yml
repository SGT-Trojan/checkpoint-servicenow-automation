---
- name: "Management API repository package - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    reports_dir: "{{ playbook_dir }}/../reports"
    scripts_dir: "{{ playbook_dir }}/../scripts"
    api_step_slug: "{{ step | default('package_step') | regex_replace('[^A-Za-z0-9_.-]+', '_') | regex_replace('^_+|_+$', '') }}"
  tasks:
    - name: Assert credentials, plan, and step are supplied
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
          - activity_plan_file | default('') | length > 0
          - step | default('') | length > 0
          - activity_plan.execution.deployment_backend | default('') == 'api'
        fail_msg: "API repository staging requires credentials and an API-authorized activity plan."

    - name: Add or confirm package in Management API repository
      ansible.builtin.command:
        argv:
          - "{{ scripts_dir }}/management_api_package_from_activity.py"
          - --activity-plan-file
          - "{{ activity_plan_file }}"
          - --step
          - "{{ step }}"
          - --phase
          - stage-files
          - --operation
          - repository
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: api_repository
      changed_when: "'Repository package identity:' in api_repository.stdout"

    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: "0700"

    - name: Save API repository evidence
      ansible.builtin.copy:
        dest: "{{ reports_dir }}/39_api_repository_{{ chg_number | default('unknown') }}_{{ api_step_slug }}.txt"
        content: "{{ api_repository.stdout }}\n{{ api_repository.stderr }}\n"
        mode: "0600"
