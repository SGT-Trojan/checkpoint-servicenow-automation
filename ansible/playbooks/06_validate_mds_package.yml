---
- name: "Validate MDS package inventory - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    reports_dir: "{{ playbook_dir }}/../reports"
    scripts_dir: "{{ playbook_dir }}/../scripts"
  tasks:
    - name: Assert credentials and activity plan are supplied
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
          - activity_plan_file | default('') | length > 0
        fail_msg: "CP_PASSWORD, CP_EXPERT_PASSWORD, and activity_plan_file are required for MDS package validation."

    - name: Validate package files and checksums on MDS
      ansible.builtin.command:
        argv:
          - "{{ scripts_dir }}/validate_mds_packages.py"
          - --activity-plan-file
          - "{{ activity_plan_file }}"
          - --username
          - admin
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: mds_packages
      changed_when: false

    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: "0755"

    - name: Save MDS package validation output
      ansible.builtin.copy:
        dest: "{{ reports_dir }}/06_validate_mds_package_{{ chg_number | default('unknown') }}.txt"
        content: "{{ mds_packages.stdout | default('') }}
{{ mds_packages.stderr | default('') }}
"
        mode: "0644"

    - name: Show MDS package validation output
      ansible.builtin.debug:
        var: mds_packages.stdout_lines
