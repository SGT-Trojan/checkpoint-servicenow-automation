---
- name: "Capture cluster state - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    scripts_dir: "{{ playbook_dir }}/../scripts"
    reports_dir: "{{ playbook_dir }}/../reports"
  tasks:
    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: "0755"

    - name: Assert credentials are supplied
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
        fail_msg: "CP_PASSWORD and CP_EXPERT_PASSWORD must be supplied via the Credential Vault."

    - name: Capture original active and standby members
      ansible.builtin.command:
        argv:
          - python3
          - "{{ scripts_dir }}/cluster_phase_control.py"
          - capture-state
          - --members
          - "{{ member_a_ip | default('192.0.2.20') }}"
          - "{{ member_b_ip | default('192.0.2.21') }}"
          - --username
          - admin
          - --state-file
          - "{{ reports_dir }}/cluster_initial_state_{{ chg_number | default('unknown') }}.json"
          - --icap-mode
          - "{{ icap_mode | default('disabled') }}"
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: cluster_state
      changed_when: false

    - name: Show captured cluster state
      ansible.builtin.debug:
        var: cluster_state.stdout_lines
