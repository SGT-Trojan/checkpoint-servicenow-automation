---
- name: "Monitor gateways - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    scripts_dir: "{{ playbook_dir }}/../scripts"
    reports_dir: "{{ playbook_dir }}/../reports"
  tasks:
    - name: Assert credentials are supplied
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
        fail_msg: "CP_PASSWORD and CP_EXPERT_PASSWORD must be supplied via the Credential Vault."

    - name: Monitor gateway state (3 samples)
      ansible.builtin.command:
        argv:
          - python3
          - "{{ scripts_dir }}/monitor_gateways.py"
          - --members
          - "{{ member_a_ip | mandatory }}"
          - "{{ member_b_ip | mandatory }}"
          - --username
          - admin
          - --icap-mode
          - "{{ icap_mode | default('disabled') }}"
          - --samples
          - "3"
          - --interval
          - "10"
          - --report
          - "{{ reports_dir }}/22_monitor_{{ chg_number | default('unknown') }}.txt"
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: monitor
      changed_when: false

    - name: Show monitoring results
      ansible.builtin.debug:
        var: monitor.stdout_lines
