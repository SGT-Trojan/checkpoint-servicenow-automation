---
- name: "CDT member reconciliation - {{ chg_number | default('N/A') }}"
  hosts: localhost
  gather_facts: false
  vars:
    reports_dir: "{{ playbook_dir }}/../reports"
    scripts_dir: "{{ playbook_dir }}/../scripts"
    cdt_step_name: "{{ step | mandatory }}"
    report_suffix: "{{ ((phase | default('')) ~ '_' ~ cdt_step_name) | regex_replace('[^A-Za-z0-9_.-]+', '_') | regex_replace('^_+|_+$', '') }}"
  tasks:
    - name: Require bound reconciliation inputs
      ansible.builtin.assert:
        that:
          - lookup('env', 'CP_PASSWORD') | length > 0
          - lookup('env', 'CP_EXPERT_PASSWORD') | length > 0
          - activity_plan_file | default('') | length > 0
          - operation_id | default('') | length > 0
          - phase | default('') in ['first-member', 'second-member']
          - step | default('') | length > 0
          - cdt_context_file | default('') | length > 0
          - cdt_mutation_receipt_file | default('') | length > 0
          - cdt_reconciliation_file | default('') | length > 0
        fail_msg: "Plan-bound CDT context, mutation receipt, and evidence paths are required."

    - name: Reconcile the exact mutated member
      ansible.builtin.command:
        argv:
          - "{{ scripts_dir }}/reconcile_cdt_member.py"
          - --activity-plan-file
          - "{{ activity_plan_file }}"
          - --context-file
          - "{{ cdt_context_file }}"
          - --receipt-file
          - "{{ cdt_mutation_receipt_file }}"
          - --evidence-file
          - "{{ cdt_reconciliation_file }}"
          - --operation-id
          - "{{ operation_id }}"
          - --phase
          - "{{ phase }}"
          - --step
          - "{{ step }}"
          - --username
          - admin
      environment:
        CP_PASSWORD: "{{ lookup('env', 'CP_PASSWORD') }}"
        CP_EXPERT_PASSWORD: "{{ lookup('env', 'CP_EXPERT_PASSWORD') }}"
      register: cdt_reconciliation
      changed_when: false

    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ reports_dir }}"
        state: directory
        mode: "0755"

    - name: Save reconciliation output
      ansible.builtin.copy:
        dest: "{{ reports_dir }}/21_cdt_reconcile_member_{{ chg_number | default('unknown') }}_{{ report_suffix }}.txt"
        content: "{{ cdt_reconciliation.stdout }}\n{{ cdt_reconciliation.stderr }}\n"
        mode: "0644"

    - name: Show reconciliation output
      ansible.builtin.debug:
        var: cdt_reconciliation.stdout_lines
